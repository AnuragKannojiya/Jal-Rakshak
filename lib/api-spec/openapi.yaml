openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: JalRakshak API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: complaints
    description: Complaint management
  - name: areas
    description: Area and water status management
  - name: alerts
    description: Community alerts
  - name: analytics
    description: Analytics and statistics
  - name: feedback
    description: User feedback
  - name: users
    description: User management (admin)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout user
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /complaints:
    get:
      operationId: listComplaints
      tags: [complaints]
      summary: List complaints
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [submitted, under_review, assigned, in_progress, resolved, rejected]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: issueType
          in: query
          schema:
            type: string
        - name: area
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: myOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of complaints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintsListResponse"

    post:
      operationId: createComplaint
      tags: [complaints]
      summary: Create a new complaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComplaintBody"
      responses:
        "201":
          description: Complaint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"

  /complaints/{id}:
    get:
      operationId: getComplaint
      tags: [complaints]
      summary: Get complaint by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Complaint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateComplaint
      tags: [complaints]
      summary: Update complaint (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComplaintBody"
      responses:
        "200":
          description: Complaint updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"

  /complaints/map:
    get:
      operationId: getComplaintsMap
      tags: [complaints]
      summary: Get complaints for map view with coordinates
      responses:
        "200":
          description: Complaints with location data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplaintMapPin"

  /areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List all areas with water status
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaStatus"

  /areas/{id}:
    get:
      operationId: getArea
      tags: [areas]
      summary: Get area details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Area details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaStatus"

    patch:
      operationId: updateArea
      tags: [areas]
      summary: Update area status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAreaBody"
      responses:
        "200":
          description: Area updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaStatus"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List active alerts
      parameters:
        - name: area
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, resolved]
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create a community alert (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertBody"
      responses:
        "201":
          description: Alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    patch:
      operationId: updateAlert
      tags: [alerts]
      summary: Update alert status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertBody"
      responses:
        "200":
          description: Alert updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get analytics summary stats
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/trends:
    get:
      operationId: getAnalyticsTrends
      tags: [analytics]
      summary: Get weekly complaint trends
      parameters:
        - name: weeks
          in: query
          schema:
            type: integer
            default: 8
      responses:
        "200":
          description: Weekly trends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

  /analytics/categories:
    get:
      operationId: getAnalyticsCategories
      tags: [analytics]
      summary: Get complaint category breakdown
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryBreakdown"

  /analytics/areas:
    get:
      operationId: getAnalyticsAreas
      tags: [analytics]
      summary: Get area-wise complaint stats
      responses:
        "200":
          description: Area stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaStat"

  /analytics/sdg:
    get:
      operationId: getSdgImpact
      tags: [analytics]
      summary: Get SDG impact counters
      responses:
        "200":
          description: SDG impact data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdgImpact"

  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit feedback for a resolved complaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackBody"
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    RegisterBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        area:
          type: string
      required: [name, email, password]

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin]
        area:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, createdAt]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    Complaint:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        complaintTitle:
          type: string
        issueType:
          type: string
        description:
          type: string
        address:
          type: string
        area:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        imageUrl:
          type: string
          nullable: true
        severityScore:
          type: integer
        priority:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [submitted, under_review, assigned, in_progress, resolved, rejected]
        adminRemark:
          type: string
          nullable: true
        resolvedImage:
          type: string
          nullable: true
        userName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, complaintTitle, issueType, description, address, area, severityScore, priority, status, createdAt, updatedAt]

    ComplaintDetail:
      allOf:
        - $ref: "#/components/schemas/Complaint"
        - type: object
          properties:
            history:
              type: array
              items:
                $ref: "#/components/schemas/ComplaintHistory"
            feedback:
              $ref: "#/components/schemas/Feedback"
              nullable: true

    ComplaintHistory:
      type: object
      properties:
        id:
          type: integer
        complaintId:
          type: integer
        changedBy:
          type: string
        oldStatus:
          type: string
        newStatus:
          type: string
        remark:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
      required: [id, complaintId, changedBy, oldStatus, newStatus, timestamp]

    ComplaintMapPin:
      type: object
      properties:
        id:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
        priority:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
        issueType:
          type: string
        complaintTitle:
          type: string
        area:
          type: string
      required: [id, latitude, longitude, priority, status, issueType, complaintTitle, area]

    ComplaintsListResponse:
      type: object
      properties:
        complaints:
          type: array
          items:
            $ref: "#/components/schemas/Complaint"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [complaints, total, page, limit]

    CreateComplaintBody:
      type: object
      properties:
        complaintTitle:
          type: string
        issueType:
          type: string
        description:
          type: string
        address:
          type: string
        area:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        imageUrl:
          type: string
          nullable: true
        urgency:
          type: string
          enum: [low, medium, high]
      required: [complaintTitle, issueType, description, address, area]

    UpdateComplaintBody:
      type: object
      properties:
        status:
          type: string
          enum: [submitted, under_review, assigned, in_progress, resolved, rejected]
        priority:
          type: string
          enum: [low, medium, high, critical]
        adminRemark:
          type: string
        resolvedImage:
          type: string

    AreaStatus:
      type: object
      properties:
        id:
          type: integer
        areaName:
          type: string
        waterScore:
          type: integer
        riskLevel:
          type: string
          enum: [safe, moderate, risky, unsafe]
        qualityTag:
          type: string
        activeComplaints:
          type: integer
        lastUpdated:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
      required: [id, areaName, waterScore, riskLevel, qualityTag, activeComplaints, lastUpdated]

    UpdateAreaBody:
      type: object
      properties:
        waterScore:
          type: integer
        riskLevel:
          type: string
          enum: [safe, moderate, risky, unsafe]
        qualityTag:
          type: string
        notes:
          type: string

    Alert:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        area:
          type: string
        level:
          type: string
          enum: [info, warning, danger, critical]
        status:
          type: string
          enum: [active, resolved]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, description, area, level, status, createdBy, createdAt]

    CreateAlertBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        area:
          type: string
        level:
          type: string
          enum: [info, warning, danger, critical]
      required: [title, description, area, level]

    UpdateAlertBody:
      type: object
      properties:
        status:
          type: string
          enum: [active, resolved]
        description:
          type: string

    AnalyticsSummary:
      type: object
      properties:
        totalComplaints:
          type: integer
        resolvedComplaints:
          type: integer
        pendingComplaints:
          type: integer
        criticalComplaints:
          type: integer
        avgResolutionHours:
          type: number
        resolutionRate:
          type: number
        totalAlerts:
          type: integer
        activeAlerts:
          type: integer
        totalAreas:
          type: integer
        unsafeAreas:
          type: integer
      required: [totalComplaints, resolvedComplaints, pendingComplaints, criticalComplaints, avgResolutionHours, resolutionRate, totalAlerts, activeAlerts, totalAreas, unsafeAreas]

    TrendDataPoint:
      type: object
      properties:
        week:
          type: string
        submitted:
          type: integer
        resolved:
          type: integer
      required: [week, submitted, resolved]

    CategoryBreakdown:
      type: object
      properties:
        issueType:
          type: string
        count:
          type: integer
        percentage:
          type: number
      required: [issueType, count, percentage]

    AreaStat:
      type: object
      properties:
        areaName:
          type: string
        total:
          type: integer
        resolved:
          type: integer
        critical:
          type: integer
        waterScore:
          type: integer
      required: [areaName, total, resolved, critical, waterScore]

    SdgImpact:
      type: object
      properties:
        complaintsResolved:
          type: integer
        areasImproved:
          type: integer
        citizensHelped:
          type: integer
        alertsIssued:
          type: integer
      required: [complaintsResolved, areasImproved, citizensHelped, alertsIssued]

    Feedback:
      type: object
      properties:
        id:
          type: integer
        complaintId:
          type: integer
        userId:
          type: integer
        rating:
          type: integer
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, complaintId, userId, rating, createdAt]

    CreateFeedbackBody:
      type: object
      properties:
        complaintId:
          type: integer
        rating:
          type: integer
        comment:
          type: string
      required: [complaintId, rating]

    UsersListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [users, total, page, limit]
